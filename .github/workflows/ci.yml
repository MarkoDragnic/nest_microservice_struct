name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx nest build gateway
      - run: npx nest build auth
      - run: npx nest build accounts
      - run: npx nest build robots
      - run: npx nest build pg_read
      - run: npx nest build pg_write
      - run: npx nest build trader
      - run: npx nest build positions
      - run: npx nest build indicators
      - run: npx nest build notifications
      - run: npx nest build price_provider
      - run: npx nest build price_calculator
      - run: npx nest build history_provider

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage --passWithNoTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build all Docker images
        run: docker compose -f docker-compose.full.yml build
        env:
          DOCKER_BUILDKIT: 1
